[project]
name = "x402-paywall"
version = "0.1.0"
description = "x402 paywall for FastAPI — any API accessible to AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "x402[fastapi,evm,httpx]>=2.5.0",
    "eth-account>=0.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
